name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to the same ref supersedes the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run coverage

      # No secrets needed: Vite inlines absent VITE_* vars as undefined, and the
      # MapTiler key is only read at runtime for tile fetches.
      - run: npm run build

  e2e:
    name: browser smoke test
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Fork PRs and clones without repo access get no secret. Rather than a red
      # X they get a skip with a reason: the test needs real MapTiler tiles,
      # because buildings — and therefore shadows — come from the basemap source.
      HAS_MAPTILER_KEY: ${{ secrets.VITE_MAPTILER_API_KEY != '' }}
      VITE_MAPTILER_API_KEY: ${{ secrets.VITE_MAPTILER_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # A warning, not a notice: this job goes green either way, and a green box
      # for a test that never ran is exactly the unearned pass the rest of this
      # repo's verification is built to prevent. Say so where a reviewer looks.
      - if: env.HAS_MAPTILER_KEY != 'true'
        run: |
          echo "::warning title=Browser smoke test did NOT run::VITE_MAPTILER_API_KEY is not available to this run (fork PR, or the secret is unset). This job is green because it was skipped, not because the smoke test passed."
          echo "### Browser smoke test skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "\`VITE_MAPTILER_API_KEY\` is unavailable here, so the smoke test did not run. It needs real basemap tiles: buildings, and therefore shadows, come from them. This job's green tick means skipped, not passed." >> "$GITHUB_STEP_SUMMARY"

      - if: env.HAS_MAPTILER_KEY == 'true'
        run: npm ci

      - if: env.HAS_MAPTILER_KEY == 'true'
        run: npx playwright install --with-deps chromium

      # Playwright builds and serves dist/ itself (see playwright.config.ts).
      # No artifact upload: traces record tile URLs, and those carry the key.
      - if: env.HAS_MAPTILER_KEY == 'true'
        run: npm run e2e
