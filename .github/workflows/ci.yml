name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to the same ref supersedes the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      # No secrets needed: Vite inlines absent VITE_* vars as undefined, and the
      # MapTiler key is only read at runtime for tile fetches.
      - run: npm run build
